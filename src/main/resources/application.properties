spring.application.name=aatmCollections

# Default local profile uses H2 so the API can start without PostgreSQL.
# Switch to `postgres` profile when PostgreSQL is available.
spring.profiles.active=local

server.port=8080

app.jwt.secret=aatm-collections-dev-secret-change-me-to-a-long-random-string-32chars-min
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.org.springframework.security=INFO
